{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %} ТехноКБ {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <script src="https://kit.fontawesome.com/0dac904ea8.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><span class="text-danger">ТЕХНО</span>КБ</a>


            <div class="d-flex align-items-center gap-2">
                <button
                    class="navbar-toggler d-md-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar-collapse"
                    aria-controls="navbar-collapse"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>
                <button id="theme-toggle1" class="d-block d-md-none btn btn-outline-secondary">
                    🌙
                </button>
                <a class="d-block d-md-none btn btn-danger px-3"
                            href="https://wa.me/+996553224265" target="_blank">Связаться</a>
                
            </div>

            <div class="collapse navbar-collapse d-md-flex justify-content-start" id="navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/products">Продукты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/services">Услуги</a>
                    </li>
                    <!-- <li class="nav-item"> -->
                        <!-- <a class="nav-link" href="/reviews">Отзывы</a> -->
                    <!-- </li> -->
                    <li class="nav-item">
                        <a class="nav-link" href="/#address">Адрес</a>
                    </li>
                    <li class="nav-item d-none d-md-block">
                        <a class="btn btn-danger px-3"
                            href="https://wa.me/+996553224265" target="_blank">Связаться</a>
                    </li>
                    <li class="nav-item">
                        <button id="theme-toggle2" class="d-none d-md-block btn btn-outline-secondary">
                            🌙
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
    {% block body %}

    {% endblock %}
    </main>

    <footer class="footer bg-dark text-white text-center p-1">
        <div class="container">ТехноКБ</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        const html = document.documentElement;
        const btn1 = document.getElementById('theme-toggle1');
        const btn2 = document.getElementById('theme-toggle2');

        const savedTheme = localStorage.getItem('theme');

        function updateText(theme){
            btn1.innerText = theme === 'dark' ? '🌙' : '☀️';
            btn2.innerText = btn1.innerText
        }
        
        if (savedTheme) {
            html.setAttribute('data-bs-theme', savedTheme);
            updateText(savedTheme);
        }



        function themeChange(){
            const newTheme = 
                html.getAttribute('data-bs-theme') === 'dark'
                    ? 'light'
                    : 'dark';
            
            updateText(newTheme);
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        btn1.addEventListener('click', themeChange);
        btn2.addEventListener('click', themeChange);

</script>
</body>

</html>
